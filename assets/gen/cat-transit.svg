<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Transit train">
  <title>Transit</title>
  <defs>
    <linearGradient id="ct-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#FBE3EC"/></linearGradient>
    <radialGradient id="ct-glow" cx="50%" cy="40%" r="55%"><stop offset="0" stop-color="#FFF4D1" stop-opacity=".8"/><stop offset="1" stop-color="#FFF4D1" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="0" y="0" width="640" height="360" rx="20" fill="url(#ct-bg)"/>
  <ellipse cx="320" cy="150" rx="240" ry="120" fill="url(#ct-glow)"/>
  <!-- rail -->
  <rect x="80" y="284" width="480" height="6" rx="3" fill="#4A4470" opacity=".5"/>
  <g stroke="#4A4470" stroke-width="4" opacity=".3"><line x1="120" y1="290" x2="120" y2="302"/><line x1="200" y1="290" x2="200" y2="302"/><line x1="280" y1="290" x2="280" y2="302"/><line x1="360" y1="290" x2="360" y2="302"/><line x1="440" y1="290" x2="440" y2="302"/><line x1="520" y1="290" x2="520" y2="302"/></g>
  <!-- AREX train body -->
  <g transform="translate(160,118)">
    <path d="M0 36 Q0 6 30 4 L300 4 Q320 4 320 36 L320 160 Q320 168 312 168 L8 168 Q0 168 0 160 Z" fill="#E84A7F"/>
    <!-- nose accent -->
    <path d="M0 36 Q0 6 30 4 L70 4 L70 168 L8 168 Q0 168 0 160 Z" fill="#C7396B"/>
    <!-- stripe -->
    <rect x="0" y="118" width="320" height="14" fill="#FFF4D1"/>
    <!-- windshield -->
    <path d="M14 30 Q16 18 32 18 L60 18 L60 60 L14 60 Z" fill="#2E2A4A"/>
    <!-- windows -->
    <g fill="#FBE3EC"><rect x="92" y="30" width="44" height="40" rx="6"/><rect x="152" y="30" width="44" height="40" rx="6"/><rect x="212" y="30" width="44" height="40" rx="6"/><rect x="272" y="30" width="36" height="40" rx="6"/></g>
    <!-- headlight -->
    <circle cx="26" cy="146" r="9" fill="#FFE89A"/>
  </g>
  <!-- speed lines -->
  <g stroke="#C7396B" stroke-width="5" stroke-linecap="round" opacity=".4"><line x1="86" y1="170" x2="146" y2="170"/><line x1="74" y1="200" x2="146" y2="200"/><line x1="92" y1="230" x2="146" y2="230"/></g>
</svg>
