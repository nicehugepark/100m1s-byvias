<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Concert venue">
  <title>Venue</title>
  <defs>
    <linearGradient id="cv-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#FBE3EC"/></linearGradient>
    <radialGradient id="cv-glow" cx="50%" cy="40%" r="55%"><stop offset="0" stop-color="#FFF4D1" stop-opacity=".8"/><stop offset="1" stop-color="#FFF4D1" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="0" y="0" width="640" height="360" rx="20" fill="url(#cv-bg)"/>
  <ellipse cx="320" cy="150" rx="240" ry="120" fill="url(#cv-glow)"/>
  <!-- dome -->
  <path d="M120 250 Q320 110 520 250 Z" fill="#E84A7F"/>
  <path d="M120 250 Q320 110 520 250" fill="none" stroke="#C7396B" stroke-width="3" opacity=".5"/>
  <g stroke="#fff" stroke-width="2.5" opacity=".4" fill="none"><path d="M200 235 Q320 150 440 235"/><path d="M250 226 Q320 168 390 226"/></g>
  <rect x="120" y="248" width="400" height="8" rx="4" fill="#4A4470"/>
  <!-- crowd band -->
  <path d="M96 288 Q320 274 544 288 L544 300 Q320 286 96 300 Z" fill="#4A4470"/>
  <!-- lightsticks -->
  <g fill="#FFF4D1"><circle cx="180" cy="276" r="7"/><circle cx="260" cy="282" r="5"/><circle cx="340" cy="274" r="7"/><circle cx="420" cy="282" r="5"/><circle cx="480" cy="276" r="6"/></g>
  <g fill="#F6B8CF"><circle cx="220" cy="280" r="5"/><circle cx="300" cy="278" r="5"/><circle cx="380" cy="280" r="5"/></g>
</svg>
