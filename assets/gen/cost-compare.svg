<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-label="Trip cost comparison by stay length">
  <title>Cost comparison by stay length</title>
  <defs>
    <linearGradient id="cc-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#FBF3DE"/></linearGradient>
    <linearGradient id="cc-bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F6B8CF"/><stop offset="1" stop-color="#E84A7F"/></linearGradient>
    <filter id="cc-sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#4A4470" flood-opacity="0.12"/></filter>
    <clipPath id="cc-clip1"><rect x="200" y="6" width="306" height="40" rx="11"/></clipPath>
    <clipPath id="cc-clip2"><rect x="200" y="6" width="436" height="40" rx="11"/></clipPath>
    <clipPath id="cc-clip3"><rect x="200" y="6" width="628" height="40" rx="11"/></clipPath>
  </defs>
  <rect x="0" y="0" width="880" height="520" rx="22" fill="url(#cc-bg)"/>

  <text x="40" y="50" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',Roboto,sans-serif" font-size="23" font-weight="800" fill="#4A4470">체류일별 원정 예산</text>
  <text x="40" y="74" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="500" fill="#8B8499">길수록 숙소·식비가 늘어납니다 · 항목 구성 비교</text>

  <!-- legend (cost components) -->
  <g font-family="-apple-system,sans-serif" font-size="12.5" font-weight="700">
    <rect x="40" y="96" width="14" height="14" rx="4" fill="#4A4470"/><text x="60" y="108" fill="#6B6A64">항공 Flight</text>
    <rect x="170" y="96" width="14" height="14" rx="4" fill="#E84A7F"/><text x="190" y="108" fill="#6B6A64">숙소 Stay</text>
    <rect x="290" y="96" width="14" height="14" rx="4" fill="#F0A93E"/><text x="310" y="108" fill="#6B6A64">식비·교통 Food·Transit</text>
    <rect x="500" y="96" width="14" height="14" rx="4" fill="#F6B8CF"/><text x="520" y="108" fill="#6B6A64">MD·기타 Goods</text>
  </g>

  <!-- rows: bar baseline x=200, full width to 840 (640px). relative widths only. -->
  <!-- ROW 1: 2박3일 (data-backed) -->
  <g transform="translate(0,150)">
    <text x="40" y="22" font-family="-apple-system,sans-serif" font-size="17" font-weight="800" fill="#2E2A4A">2박 3일</text>
    <text x="40" y="42" font-family="-apple-system,sans-serif" font-size="11.5" font-weight="600" fill="#0F6E56">실데이터 기반</text>
    <!-- stacked relative bar total ~ 300px -->
    <g filter="url(#cc-sh)" clip-path="url(#cc-clip1)">
      <rect x="200" y="6" width="78" height="40" fill="#4A4470"/>
      <rect x="278" y="6" width="120" height="40" fill="#E84A7F"/>
      <rect x="398" y="6" width="64" height="40" fill="#F0A93E"/>
      <rect x="462" y="6" width="44" height="40" fill="#F6B8CF"/>
    </g>
    <text x="520" y="32" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#6B6A64">기준 ·  baseline</text>
  </g>

  <!-- ROW 2: 4박5일 (placeholder) -->
  <g transform="translate(0,222)">
    <text x="40" y="22" font-family="-apple-system,sans-serif" font-size="17" font-weight="800" fill="#2E2A4A">4박 5일</text>
    <text x="40" y="42" font-family="-apple-system,sans-serif" font-size="11.5" font-weight="600" fill="#9A5B00">상세 준비 중</text>
    <g opacity="0.55" clip-path="url(#cc-clip2)">
      <rect x="200" y="6" width="78" height="40" fill="#4A4470"/>
      <rect x="278" y="6" width="196" height="40" fill="#E84A7F"/>
      <rect x="474" y="6" width="104" height="40" fill="#F0A93E"/>
      <rect x="578" y="6" width="58" height="40" fill="#F6B8CF"/>
    </g>
    <text x="650" y="32" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#9A8B6E">숙소·식비 ↑</text>
  </g>

  <!-- ROW 3: 7박8일 (placeholder) -->
  <g transform="translate(0,294)">
    <text x="40" y="22" font-family="-apple-system,sans-serif" font-size="17" font-weight="800" fill="#2E2A4A">7박 8일</text>
    <text x="40" y="42" font-family="-apple-system,sans-serif" font-size="11.5" font-weight="600" fill="#9A5B00">상세 준비 중</text>
    <g opacity="0.4" clip-path="url(#cc-clip3)">
      <rect x="200" y="6" width="78" height="40" fill="#4A4470"/>
      <rect x="278" y="6" width="320" height="40" fill="#E84A7F"/>
      <rect x="598" y="6" width="156" height="40" fill="#F0A93E"/>
      <rect x="754" y="6" width="74" height="40" fill="#F6B8CF"/>
    </g>
  </g>
  <text x="754" y="338" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#9A8B6E" text-anchor="middle"></text>

  <!-- note -->
  <g transform="translate(40,380)">
    <rect x="0" y="0" width="800" height="56" rx="14" fill="#FFF6EC" stroke="#F3D9BC" stroke-width="1.5"/>
    <text x="20" y="24" font-family="-apple-system,sans-serif" font-size="13.5" font-weight="700" fill="#9A5B00">항공권은 체류일이 길어져도 크게 안 변합니다 — 늘어나는 건 숙소·식비.</text>
    <text x="20" y="44" font-family="-apple-system,sans-serif" font-size="12.5" font-weight="500" fill="#A8895C">막대는 항목 비중을 나타냅니다. 절대 금액은 시즌·환율로 달라져 표기하지 않았습니다.</text>
  </g>

  <text x="840" y="476" text-anchor="end" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#C7396B" letter-spacing="0.5">by<tspan fill="#E84A7F">bias</tspan></text>
</svg>
