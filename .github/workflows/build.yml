name: Deploy pre-built site to GitHub Pages

# 다국어 번역은 로컬 빌드(번역 캐시) 산출물 dist/ 를 그대로 배포.
# CI에서 generate.py 를 재실행하지 않음 (CI엔 번역 LLM 없음 → 외국어 깨짐 방지).
# 콘텐츠/번역 갱신 = 로컬 `python3 generate.py` 후 dist/ 커밋·푸시.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
