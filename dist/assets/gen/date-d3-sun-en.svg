<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" width="540" height="540" role="img" aria-label="Show date Sunday July 12">
  <title>7/12 Sun show date</title>
  <defs>
    <linearGradient id="d3-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#F0E8F6"/></linearGradient>
    <linearGradient id="d3-band" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6B5FA0"/><stop offset="1" stop-color="#4A4470"/></linearGradient>
    <filter id="d3-sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#332C5A" flood-opacity="0.18"/></filter>
  <style>@media (prefers-color-scheme: dark){.svg-panel{fill:#1c1b22!important}.svg-card{fill:#262430!important}.svg-tx{fill:#d6d3cb!important}.svg-bigdate{fill:#4a4668!important}.svg-timecard{fill:#262430!important}}</style></defs>
  <rect x="0" y="0" width="540" height="540" rx="32" fill="url(#d3-bg)" class="svg-panel"/>
  <rect x="46" y="60" width="448" height="420" rx="24" fill="#fff" filter="url(#d3-sh)" class="svg-card"/>
  <path d="M46 84 a24 24 0 0 1 24 -24 h400 a24 24 0 0 1 24 24 v40 h-448 Z" fill="url(#d3-band)"/>
  <text x="270" y="111" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="800" fill="#fff" letter-spacing="2">SUNDAY</text>
  <text x="270" y="220" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="92" font-weight="800" fill="#2E2A4A" letter-spacing="-2" class="svg-bigdate">7.12</text>
  <text x="270" y="252" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="600" fill="#8B8499" class="svg-tx">2026 · KSPO DOME, SEOUL</text>
  <g transform="translate(0,300)">
    <rect x="86" y="0" width="170" height="84" rx="16" fill="#EFEBF7" stroke="#D6CEE9" stroke-width="1.5"/>
    <text x="171" y="34" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#5A4E8C">START</text>
    <text x="171" y="66" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="30" font-weight="800" fill="#4A4470" class="svg-tx">17:00</text>
    <rect x="284" y="0" width="170" height="84" rx="16" fill="#FAF8F2" stroke="#E7E5DD" stroke-width="1.5" class="svg-timecard"/>
    <text x="369" y="34" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#8B8499" class="svg-tx">END ≈</text>
    <text x="369" y="66" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="30" font-weight="800" fill="#6B6A64" class="svg-tx">19:40</text>
  </g>
  <g transform="translate(270,432)">
    <rect x="-104" y="-22" width="208" height="44" rx="22" fill="#4A4470"/>
    <text x="0" y="7" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="18" font-weight="800" fill="#fff">D-day · FINALE</text>
  </g>
  <text x="270" y="516" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#C7396B" letter-spacing="0.5">by<tspan fill="#E84A7F">bias</tspan></text>
