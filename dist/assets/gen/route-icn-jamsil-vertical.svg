<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" width="480" height="620" role="img" aria-label="Incheon Airport to KSPO Dome transit route (vertical)">
  <title>ICN Airport to KSPO Dome — transit route (vertical)</title>
  <defs>
    <linearGradient id="rv-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#FBF3DE"/>
    </linearGradient>
    <filter id="rv-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#4A4470" flood-opacity="0.16"/>
    </filter>
  <style>@media (prefers-color-scheme: dark){.svg-panel{fill:#1c1b22!important}.svg-card{fill:#262430!important}.svg-tx{fill:#d6d3cb!important}}</style></defs>

  <rect x="0" y="0" width="480" height="620" rx="22" fill="url(#rv-sun)" class="svg-panel"/>

  <text x="34" y="50" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',Roboto,sans-serif" font-size="22" font-weight="800" fill="#4A4470" class="svg-tx">ICN → KSPO DOME</text>
  <text x="34" y="74" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="500" fill="#8B8499" class="svg-tx">≈ 80 min total</text>

  <!-- rail x = 80; nodes y = 140, 280, 420, 560 -->
  <g stroke-linecap="round" fill="none" stroke-width="9">
    <line x1="80" y1="164" x2="80" y2="256" stroke="#E84A7F"/>
    <line x1="80" y1="304" x2="80" y2="396" stroke="#E84A7F"/>
    <line x1="80" y1="444" x2="80" y2="536" stroke="#C7396B"/>
  </g>

  <!-- segment badges on the rail mid-points (x=80) shifted right of rail -->
  <g transform="translate(80,210)">
    <rect x="22" y="-17" width="118" height="34" rx="17" fill="#fff" stroke="#F3D9CB" stroke-width="1.5" filter="url(#rv-soft)" class="svg-card"/>
    <text x="81" y="-1" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="800" fill="#C7396B">AREX</text>
    <text x="81" y="12" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" font-weight="600" fill="#8B8499" class="svg-tx">≈ 43 min</text>
  </g>
  <g transform="translate(80,350)">
    <rect x="22" y="-17" width="134" height="34" rx="17" fill="#fff" stroke="#F3D9CB" stroke-width="1.5" filter="url(#rv-soft)" class="svg-card"/>
    <text x="89" y="-1" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12.5" font-weight="800" fill="#C7396B">Line 2 · Line 8</text>
    <text x="89" y="12" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" font-weight="600" fill="#8B8499" class="svg-tx">≈ 28 min</text>
  </g>
  <g transform="translate(80,490)">
    <rect x="22" y="-16" width="104" height="32" rx="16" fill="#FFF9E8" stroke="#F0E0B8" stroke-width="1.5" class="svg-card"/>
    <text x="74" y="-1" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11.5" font-weight="800" fill="#7A5A12">walk</text>
    <text x="74" y="11" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10.5" font-weight="600" fill="#9A7B2C">≈ 8 min</text>
  </g>

  <!-- NODE 1 ICN -->
  <g transform="translate(80,140)">
    <circle r="24" fill="#fff" stroke="#E84A7F" stroke-width="6" filter="url(#rv-soft)"/>
    <g transform="translate(-12,-12)" fill="#E84A7F">
      <path d="M23.5 12.2 14 14.4l-3.2-6.1c-.2-.4-.6-.6-1-.5l-1.5.3c-.5.1-.8.6-.6 1.1l2 5.7-3.6.8-1.8-2.1c-.2-.2-.5-.3-.8-.2l-1 .2c-.5.1-.7.6-.5 1l1.3 2.6-.9 2c-.2.4 0 .9.5 1l.2.1 2.1-.5 1.5 2.5c.2.4.6.5 1 .4l1-.2c.4-.1.6-.5.5-.9l-.6-2.7 3.6-.8.5 6c0 .5.5.9 1 .8l1.5-.3c.4-.1.7-.4.7-.9l.4-6.9 9.5-2.2c.7-.2 1.2-.8 1.2-1.5 0-1-1-1.8-2-1.5z"/>
    </g>
    <text x="124" y="-4" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="18" font-weight="800" fill="#2E2A4A">ICN</text>
    <text x="170" y="16" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#6B6A64" class="svg-tx">Incheon Airport</text>
  </g>
  <!-- NODE 2 Seoul -->
  <g transform="translate(80,280)">
    <circle r="22" fill="#fff" stroke="#C7396B" stroke-width="5" filter="url(#rv-soft)"/>
    <g transform="translate(-11,-11) scale(1.05)" fill="#C7396B"><rect x="2" y="1" width="16" height="14" rx="4"/><rect x="5" y="4" width="10" height="5" rx="1.5" fill="#fff" class="svg-card"/><circle cx="6.5" cy="17" r="1.8"/><circle cx="13.5" cy="17" r="1.8"/><rect x="3.5" y="15.5" width="3" height="2.5" rx="1"/><rect x="13.5" y="15.5" width="3" height="2.5" rx="1"/></g>
    <text x="150" y="-2" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="17" font-weight="800" fill="#2E2A4A">Seoul Stn.</text>
    <text x="178" y="16" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#6B6A64" class="svg-tx">transfer hub</text>
  </g>
  <!-- NODE 3 Jamsil -->
  <g transform="translate(80,420)">
    <circle r="22" fill="#fff" stroke="#C7396B" stroke-width="5" filter="url(#rv-soft)"/>
    <g transform="translate(-11,-11) scale(1.05)" fill="#C7396B"><rect x="2" y="1" width="16" height="14" rx="4"/><rect x="5" y="4" width="10" height="5" rx="1.5" fill="#fff" class="svg-card"/><circle cx="6.5" cy="17" r="1.8"/><circle cx="13.5" cy="17" r="1.8"/><rect x="3.5" y="15.5" width="3" height="2.5" rx="1"/><rect x="13.5" y="15.5" width="3" height="2.5" rx="1"/></g>
    <text x="124" y="-2" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="17" font-weight="800" fill="#2E2A4A">Jamsil</text>
    <text x="156" y="16" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#6B6A64" class="svg-tx">stay base</text>
  </g>
  <!-- NODE 4 Dome -->
  <g transform="translate(80,560)">
    <circle r="26" fill="#E84A7F" stroke="#fff" stroke-width="4" filter="url(#rv-soft)"/>
    <g transform="translate(-13,-12) scale(1.08)" fill="#fff"><path d="M2 13a10 10 0 0 1 20 0v1H2z"/><rect x="1" y="14" width="22" height="3" rx="1.5"/></g>
    <text x="150" y="-2" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="18" font-weight="800" fill="#2E2A4A">KSPO Dome</text>
    <text x="148" y="17" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#C7396B">the venue</text>
  </g>
</svg>
