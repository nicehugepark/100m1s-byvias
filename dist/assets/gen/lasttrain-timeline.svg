<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" role="img" aria-label="Last train timeline from the venue, weekday vs weekend">
  <title>Last train timeline — weekday vs weekend</title>
  <defs>
    <linearGradient id="lt-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#FBF3DE"/></linearGradient>
    <filter id="lt-sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#4A4470" flood-opacity="0.14"/></filter>
  <style>@media (prefers-color-scheme: dark){.svg-panel{fill:#1c1b22!important}.svg-card{fill:#262430!important}.svg-tx{fill:#d6d3cb!important}}</style></defs>
  <rect x="0" y="0" width="880" height="620" rx="22" fill="url(#lt-bg)" class="svg-panel"/>

  <text x="40" y="50" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',Roboto,sans-serif" font-size="23" font-weight="800" fill="#4A4470" class="svg-tx">Last train from the venue</text>
  <text x="40" y="74" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="500" fill="#8B8499" class="svg-tx">올림픽공원역(5·9) / 몽촌토성역(8) · 역산 추정 — 당일 공식 앱 확인</text>

  <!-- legend: line color chips -->
  <g font-family="-apple-system,sans-serif" font-size="13" font-weight="700">
    <circle cx="48" cy="104" r="9" fill="#8B50A4"/><text x="63" y="109" fill="#6B6A64" class="svg-tx">Line 5</text>
    <circle cx="148" cy="104" r="9" fill="#E6186C"/><text x="163" y="109" fill="#6B6A64" class="svg-tx">Line 8</text>
    <circle cx="248" cy="104" r="9" fill="#C9A227"/><text x="263" y="109" fill="#6B6A64" class="svg-tx">Line 9</text>
  </g>

  <!-- time axis 22:00 .. 01:00, x: 220 -> 820 -->
  <!-- ticks: 22:00@220 23:00@420 00:00@620 01:00@820 -->
  <g font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#A8A29A">
    <line x1="220" y1="150" x2="220" y2="560" stroke="#E7E0CC" stroke-width="1.5"/>
    <line x1="420" y1="150" x2="420" y2="560" stroke="#E7E0CC" stroke-width="1.5"/>
    <line x1="620" y1="150" x2="620" y2="560" stroke="#E7E0CC" stroke-width="1.5"/>
    <line x1="820" y1="150" x2="820" y2="560" stroke="#E7E0CC" stroke-width="1.5"/>
    <text x="220" y="144" text-anchor="middle">22:00</text>
    <text x="420" y="144" text-anchor="middle">23:00</text>
    <text x="620" y="144" text-anchor="middle">00:00</text>
    <text x="820" y="144" text-anchor="middle">01:00</text>
  </g>

  <!-- ============ WEEKDAY (Fri) block ============ -->
  <text x="40" y="186" font-family="-apple-system,sans-serif" font-size="15" font-weight="800" fill="#2E2A4A">금요일 · Weekday</text>
  <!-- min(22:00) maps x=220, scale: 1 min = (820-220)/180 = 3.333 px ; t=22:00 -> 0 -->
  <!-- Line5 ~00:38 = 158min -> 220+158*3.333=746 -->
  <g font-family="-apple-system,sans-serif">
    <rect x="40" y="200" width="86" height="26" rx="13" fill="#8B50A4"/><text x="83" y="218" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Line 5</text>
    <line x1="220" y1="213" x2="746" y2="213" stroke="#8B50A4" stroke-width="6" stroke-linecap="round"/>
    <circle cx="746" cy="213" r="9" fill="#8B50A4"/><text x="762" y="218" font-size="13" font-weight="800" fill="#5A2E6E">00:38</text>
  </g>
  <!-- Line8 ~00:54 = 174min -> 220+174*3.333=800 -->
  <g font-family="-apple-system,sans-serif">
    <rect x="40" y="240" width="86" height="26" rx="13" fill="#E6186C"/><text x="83" y="258" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Line 8</text>
    <line x1="220" y1="253" x2="800" y2="253" stroke="#E6186C" stroke-width="6" stroke-linecap="round"/>
    <circle cx="800" cy="253" r="9" fill="#E6186C"/><text x="816" y="258" font-size="13" font-weight="800" fill="#B01155">00:54</text>
  </g>
  <!-- Line9 east ~00:50=170 ->786 ; west(개화) ~23:56=116 ->607 -->
  <g font-family="-apple-system,sans-serif">
    <rect x="40" y="280" width="86" height="26" rx="13" fill="#C9A227"/><text x="83" y="298" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Line 9</text>
    <line x1="220" y1="293" x2="786" y2="293" stroke="#C9A227" stroke-width="6" stroke-linecap="round"/>
    <circle cx="607" cy="293" r="7" fill="#fff" stroke="#C9A227" stroke-width="3"/><text x="607" y="316" text-anchor="middle" font-size="11" font-weight="700" fill="#9A7B1E">개화 23:56</text>
    <circle cx="786" cy="293" r="9" fill="#C9A227"/><text x="802" y="298" font-size="13" font-weight="800" fill="#9A7B1E">동행 00:50</text>
  </g>

  <!-- divider -->
  <line x1="40" y1="340" x2="840" y2="340" stroke="#EAE3D0" stroke-width="1.5" stroke-dasharray="3 6"/>

  <!-- ============ WEEKEND (Sat/Sun) block ============ -->
  <text x="40" y="376" font-family="-apple-system,sans-serif" font-size="15" font-weight="800" fill="#2E2A4A">토·일 · Weekend</text>
  <text x="40" y="394" font-family="-apple-system,sans-serif" font-size="11.5" font-weight="600" fill="#A8A29A" class="svg-tx">단축 운행</text>
  <!-- Line5 마천~23:49=109->583 방화~23:54=114->600 -->
  <g font-family="-apple-system,sans-serif">
    <rect x="40" y="404" width="86" height="26" rx="13" fill="#8B50A4"/><text x="83" y="422" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Line 5</text>
    <line x1="220" y1="417" x2="600" y2="417" stroke="#8B50A4" stroke-width="6" stroke-linecap="round"/>
    <circle cx="583" cy="417" r="7" fill="#fff" stroke="#8B50A4" stroke-width="3"/><text x="583" y="440" text-anchor="middle" font-size="11" font-weight="700" fill="#5A2E6E">마천 23:49</text>
    <circle cx="600" cy="417" r="9" fill="#8B50A4"/><text x="616" y="422" font-size="12.5" font-weight="800" fill="#5A2E6E">방화 23:54</text>
  </g>
  <!-- Line8 ~23:56=116->607 -->
  <g font-family="-apple-system,sans-serif">
    <rect x="40" y="444" width="86" height="26" rx="13" fill="#E6186C"/><text x="83" y="462" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Line 8</text>
    <line x1="220" y1="457" x2="607" y2="457" stroke="#E6186C" stroke-width="6" stroke-linecap="round"/>
    <circle cx="607" cy="457" r="9" fill="#E6186C"/><text x="623" y="462" font-size="12.5" font-weight="800" fill="#B01155">23:56</text>
  </g>
  <!-- Line9 east~23:55=115->603 ; west개화~22:55=55->403 TRAP -->
  <g font-family="-apple-system,sans-serif">
    <rect x="40" y="484" width="86" height="26" rx="13" fill="#C9A227"/><text x="83" y="502" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Line 9</text>
    <line x1="220" y1="497" x2="603" y2="497" stroke="#C9A227" stroke-width="6" stroke-linecap="round"/>
    <circle cx="603" cy="497" r="9" fill="#C9A227"/><text x="619" y="502" font-size="12.5" font-weight="800" fill="#9A7B1E">동행 23:55</text>
    <!-- TRAP marker at 22:55 -->
    <circle cx="403" cy="497" r="11" fill="#A32D2D"/><path d="M403 491 v6 M403 502 v0.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="403" cy="503" r="1.3" fill="#fff"/><text x="403" y="520" text-anchor="middle" font-size="11" font-weight="800" fill="#A32D2D">개화 22:55</text>
  </g>

  <!-- TRAP callout -->
  <g transform="translate(220,540)">
    <rect x="0" y="0" width="620" height="56" rx="14" fill="#FBE3E3" stroke="#E7B7B7" stroke-width="1.5"/>
    <circle cx="30" cy="28" r="13" fill="#A32D2D"/><path d="M30 21 v8 M30 33 v0.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="30" cy="34" r="1.5" fill="#fff"/>
    <text x="54" y="24" font-family="-apple-system,sans-serif" font-size="14" font-weight="800" fill="#A32D2D">함정 · The one trap</text>
    <text x="54" y="43" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7A2222">9호선 서행(개화행) + 토·일 = 막차 ~22:55 — 다른 노선보다 1시간 빠름</text>
  </g>
</svg>
