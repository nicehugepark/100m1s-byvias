<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="WOWPASS 결제 3단계 플로우 — 발급, 충전, 완료">
  <title>WOWPASS 3단계 — 발급 · 충전 · 끝</title>
  <desc>1단계 발급: 공항 키오스크에서 여권으로 약 5분, 등록비 6,000원. 2단계 충전: 앱에서 해외카드로 충전(앱 4% 수수료, 키오스크 무료). 3단계: 티켓 결제·교통·편의점까지 한 장으로 해결.</desc>
  <defs>
    <linearGradient id="wp-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#FBF3DE"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="880" height="360" rx="22" fill="url(#wp-bg)"/>

  <text x="40" y="50" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',Roboto,sans-serif" font-size="23" font-weight="800" fill="#4A4470">WOWPASS, 3단계면 끝</text>
  <text x="40" y="74" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="500" fill="#8B8499">해외카드 3DS 실패가 잦은 한국 — 선불카드 한 장으로 결제·교통 통합</text>

  <!-- connecting arrows between steps -->
  <g stroke="#E0B94E" stroke-width="2.5" fill="none">
    <path d="M298 200 h26" marker-end="url(#wp-arr)"/>
    <path d="M584 200 h26" marker-end="url(#wp-arr)"/>
  </g>
  <defs><marker id="wp-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E0B94E"/></marker></defs>

  <!-- STEP 1 — 발급 -->
  <g font-family="-apple-system,'Apple SD Gothic Neo',sans-serif">
    <rect x="40" y="110" width="256" height="180" rx="16" fill="#fff" stroke="#E8C063" stroke-width="1.6"/>
    <circle cx="78" cy="150" r="18" fill="#FFF4D1"/><text x="78" y="156" text-anchor="middle" font-size="17" font-weight="800" fill="#9A7B1E">1</text>
    <!-- card icon -->
    <rect x="108" y="138" width="30" height="22" rx="4" fill="none" stroke="#C9A227" stroke-width="2"/><path d="M108 146 h30" stroke="#C9A227" stroke-width="2"/>
    <text x="168" y="156" text-anchor="middle" font-size="17" font-weight="800" fill="#7A5B12">발급</text>
    <text x="62" y="194" font-size="13.5" font-weight="700" fill="#3A3730">공항 도착층 키오스크</text>
    <text x="62" y="216" font-size="12.5" font-weight="600" fill="#6B6A64">여권만 있으면 약 5분</text>
    <text x="62" y="238" font-size="12.5" font-weight="600" fill="#6B6A64">등록비 6,000원 (환불 불가)</text>
    <text x="62" y="262" font-size="11.5" font-weight="600" fill="#A8A29A">온라인 사전 예약 시 줄 스킵</text>
  </g>

  <!-- STEP 2 — 충전 -->
  <g font-family="-apple-system,'Apple SD Gothic Neo',sans-serif">
    <rect x="326" y="110" width="256" height="180" rx="16" fill="#fff" stroke="#E8C063" stroke-width="1.6"/>
    <circle cx="364" cy="150" r="18" fill="#FFF4D1"/><text x="364" y="156" text-anchor="middle" font-size="17" font-weight="800" fill="#9A7B1E">2</text>
    <!-- phone icon -->
    <rect x="394" y="136" width="18" height="28" rx="3" fill="none" stroke="#C9A227" stroke-width="2"/><circle cx="403" cy="159" r="1.4" fill="#C9A227"/>
    <text x="454" y="156" text-anchor="middle" font-size="17" font-weight="800" fill="#7A5B12">충전</text>
    <text x="348" y="194" font-size="13.5" font-weight="700" fill="#3A3730">WOWPASS 앱 설치 후</text>
    <text x="348" y="216" font-size="12.5" font-weight="600" fill="#6B6A64">해외카드(VISA·MC·AMEX)로 충전</text>
    <text x="348" y="240" font-size="12" font-weight="600" fill="#A8A29A">앱 충전 4% · 키오스크 충전 무료</text>
  </g>

  <!-- STEP 3 — 끝 -->
  <g font-family="-apple-system,'Apple SD Gothic Neo',sans-serif">
    <rect x="612" y="110" width="228" height="180" rx="16" fill="#E3F1EC" stroke="#A9D6C6" stroke-width="1.6"/>
    <circle cx="650" cy="150" r="18" fill="#0F6E56"/><path d="M642 150l5 5 9-9" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="722" y="156" text-anchor="middle" font-size="17" font-weight="800" fill="#0F6E56">끝</text>
    <text x="634" y="196" font-size="13.5" font-weight="700" fill="#1C5C49">이제 한 장으로</text>
    <text x="634" y="220" font-size="13" font-weight="600" fill="#2C6B57">· 티켓 결제</text>
    <text x="634" y="242" font-size="13" font-weight="600" fill="#2C6B57">· 지하철·버스·택시</text>
    <text x="634" y="264" font-size="13" font-weight="600" fill="#2C6B57">· 편의점 결제</text>
  </g>

  <!-- footer note -->
  <text x="40" y="328" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#A8A29A">가입·예매 시 여권 영문명 정확히 — 한 글자만 틀려도 입장 거부 위험. 교통만 필요하면 티머니 코리아투어카드도 대안.</text>
</svg>
