<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-label="티켓 예매 타임라인 — 선예매 6/9, 일반예매 6/11, 취소표 구간, 취소 마감 전일 17시">
  <title>티켓 예매 타임라인 — 선예매 · 일반예매 · 취소표 · 마감</title>
  <desc>팬클럽 선예매 2026-06-09 20:00, 일반 예매 2026-06-11 20:00, 취소표는 예매 다음날 새벽 0~2시에 풀림, 취소·환불 마감은 관람 전일 17:00.</desc>
  <defs>
    <linearGradient id="tk-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#FBF3DE"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="880" height="560" rx="22" fill="url(#tk-bg)"/>

  <text x="40" y="50" font-family="-apple-system,'Apple SD Gothic Neo','Segoe UI',Roboto,sans-serif" font-size="23" font-weight="800" fill="#4A4470">예매 타임라인 — 한눈에</text>
  <text x="40" y="74" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="500" fill="#8B8499">선예매 → 일반예매 → 취소표 → 취소 마감 · 시각은 KST · 공식(NOL) 공지 우선</text>

  <!-- vertical day axis: 6/9 .. 7/12, y maps 130(6/9) -> 470(7/12) -->
  <line x1="120" y1="128" x2="120" y2="478" stroke="#E7E0CC" stroke-width="2"/>

  <!-- ===== STEP 1 — 선예매 6/9 ===== -->
  <g font-family="-apple-system,'Apple SD Gothic Neo',sans-serif">
    <circle cx="120" cy="150" r="11" fill="#C9A227"/><text x="120" y="155" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text>
    <rect x="152" y="126" width="296" height="50" rx="13" fill="#FFF4D1" stroke="#E8C063" stroke-width="1.5"/>
    <text x="170" y="150" font-size="15" font-weight="800" fill="#7A5B12">팬클럽 ONCE 선예매</text>
    <text x="170" y="168" font-size="12.5" font-weight="600" fill="#9A7B1E">6/9 (화) 20:00 ~ 23:59</text>
    <rect x="470" y="138" width="78" height="26" rx="13" fill="#fff" stroke="#E8C063" stroke-width="1.5"/>
    <text x="509" y="156" text-anchor="middle" font-size="12.5" font-weight="800" fill="#9A7B1E">ONCE only</text>
  </g>

  <!-- ===== STEP 2 — 일반예매 6/11 (HERO) ===== -->
  <g font-family="-apple-system,'Apple SD Gothic Neo',sans-serif">
    <circle cx="120" cy="240" r="13" fill="#E84A7F"/><text x="120" y="245" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text>
    <rect x="150" y="212" width="500" height="58" rx="14" fill="#FCE7EE" stroke="#E84A7F" stroke-width="2"/>
    <text x="170" y="240" font-size="17" font-weight="800" fill="#B4275B">일반 예매 — 누구나</text>
    <text x="170" y="260" font-size="13.5" font-weight="700" fill="#8E2049">6/11 (목) 20:00 KST · NOL Ticket (world.nol.com)</text>
    <rect x="556" y="226" width="78" height="30" rx="15" fill="#E84A7F"/>
    <text x="595" y="246" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">D-DAY</text>
  </g>
  <text x="170" y="290" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#A8A29A">가격 154,000원 (≈$110) · 스탠딩=플로어 입석 / 지정석=좌석번호</text>

  <!-- ===== STEP 3 — 취소표 (예매 다음날 새벽) ===== -->
  <g font-family="-apple-system,'Apple SD Gothic Neo',sans-serif">
    <circle cx="120" cy="350" r="11" fill="#8B50A4"/><text x="120" y="355" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text>
    <rect x="152" y="322" width="360" height="64" rx="13" fill="#F3EAF7" stroke="#B68BCB" stroke-width="1.5"/>
    <text x="170" y="346" font-size="15" font-weight="800" fill="#6E3E88">취소표가 풀리는 구간</text>
    <text x="170" y="365" font-size="12.5" font-weight="700" fill="#7E4E98">예매 다음날 새벽 0~2시 (미입금 방출)</text>
    <text x="170" y="381" font-size="12" font-weight="600" fill="#9070A8">+ 공연 전날·당일 막판 — 같은 NOL 페이지 새로고침</text>
  </g>

  <!-- ===== STEP 4 — 취소 마감 (전일 17시) ===== -->
  <g font-family="-apple-system,'Apple SD Gothic Neo',sans-serif">
    <circle cx="120" cy="450" r="11" fill="#6B6A64"/><text x="120" y="455" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">4</text>
    <rect x="152" y="430" width="360" height="44" rx="13" fill="#EEECE5" stroke="#CFCcC2" stroke-width="1.5"/>
    <text x="170" y="450" font-size="14.5" font-weight="800" fill="#55534C">취소·환불 마감 — 관람 전일 17:00</text>
    <text x="170" y="467" font-size="12" font-weight="600" fill="#8B8980">그 전까지가 취소표가 나오는 마지막 구간</text>
  </g>

  <!-- TIP callout -->
  <g transform="translate(150,498)" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif">
    <rect x="0" y="0" width="690" height="46" rx="14" fill="#E3F1EC" stroke="#A9D6C6" stroke-width="1.5"/>
    <circle cx="28" cy="23" r="12" fill="#0F6E56"/><path d="M22 23l4 4 8-8" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="20" font-size="13" font-weight="800" fill="#0F6E56">팁 · Pro tip</text>
    <text x="50" y="38" font-size="12.5" font-weight="600" fill="#1C5C49">미리 NOL 로그인 + 결제수단(WOWPASS) 등록 → 풀리면 좌석 누르고 결제까지 한 번에</text>
  </g>
</svg>
