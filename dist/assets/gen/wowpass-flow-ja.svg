<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="WOWPASS 3ステップフロー — 発行、チャージ、完了">
  <title>WOWPASS 3ステップ — 発行 · チャージ · 完了</title>
  <desc>ステップ1 発行：空港キオスクでパスポートを使い約5分、登録料6,000ウォン。ステップ2 チャージ：アプリで海外カードからチャージ(アプリ4%手数料、キオスクは無料)。ステップ3：チケット決済・交通・コンビニまで1枚で完結。</desc>
  <defs>
    <linearGradient id="wp-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#FBF3DE"/></linearGradient>
    <marker id="wp-arr-ja" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E0B94E"/></marker>
  <style>@media (prefers-color-scheme: dark){.svg-panel{fill:#1c1b22!important}.svg-card{fill:#262430!important}.svg-tx{fill:#d6d3cb!important}}</style></defs>
  <rect x="0" y="0" width="880" height="360" rx="22" fill="url(#wp-bg)" class="svg-panel"/>

  <text x="40" y="50" font-family="-apple-system,'Hiragino Sans','Yu Gothic',sans-serif" font-size="23" font-weight="800" fill="#4A4470" class="svg-tx">WOWPASS、3ステップで完了</text>
  <text x="40" y="74" font-family="-apple-system,'Hiragino Sans',sans-serif" font-size="13.5" font-weight="500" fill="#8B8499" class="svg-tx">海外カードの3DS失敗が多い韓国 — プリペイドカード1枚で決済・交通を統合</text>

  <!-- connecting arrows between steps -->
  <g stroke="#E0B94E" stroke-width="2.5" fill="none">
    <path d="M298 200 h26" marker-end="url(#wp-arr-ja)"/>
    <path d="M584 200 h26" marker-end="url(#wp-arr-ja)"/>
  </g>

  <!-- STEP 1 — 発行 -->
  <g font-family="-apple-system,'Hiragino Sans','Yu Gothic',sans-serif">
    <rect x="40" y="110" width="256" height="180" rx="16" fill="#fff" stroke="#E8C063" stroke-width="1.6" class="svg-card"/>
    <circle cx="78" cy="150" r="18" fill="#FFF4D1"/><text x="78" y="156" text-anchor="middle" font-size="17" font-weight="800" fill="#9A7B1E">1</text>
    <!-- card icon -->
    <rect x="108" y="138" width="30" height="22" rx="4" fill="none" stroke="#C9A227" stroke-width="2"/><path d="M108 146 h30" stroke="#C9A227" stroke-width="2"/>
    <text x="176" y="156" text-anchor="middle" font-size="17" font-weight="800" fill="#7A5B12">発行</text>
    <text x="62" y="194" font-size="13.5" font-weight="700" fill="#3A3730">空港到着階のキオスク</text>
    <text x="62" y="216" font-size="12.5" font-weight="600" fill="#6B6A64" class="svg-tx">パスポートだけで約5分</text>
    <text x="62" y="238" font-size="12.5" font-weight="600" fill="#6B6A64" class="svg-tx">登録料6,000ウォン(返金不可)</text>
    <text x="62" y="262" font-size="11.5" font-weight="600" fill="#A8A29A" class="svg-tx">オンライン事前予約で列をスキップ</text>
  </g>

  <!-- STEP 2 — チャージ -->
  <g font-family="-apple-system,'Hiragino Sans','Yu Gothic',sans-serif">
    <rect x="326" y="110" width="256" height="180" rx="16" fill="#fff" stroke="#E8C063" stroke-width="1.6" class="svg-card"/>
    <circle cx="364" cy="150" r="18" fill="#FFF4D1"/><text x="364" y="156" text-anchor="middle" font-size="17" font-weight="800" fill="#9A7B1E">2</text>
    <!-- phone icon -->
    <rect x="394" y="136" width="18" height="28" rx="3" fill="none" stroke="#C9A227" stroke-width="2"/><circle cx="403" cy="159" r="1.4" fill="#C9A227"/>
    <text x="470" y="156" text-anchor="middle" font-size="17" font-weight="800" fill="#7A5B12">チャージ</text>
    <text x="348" y="194" font-size="13.5" font-weight="700" fill="#3A3730">WOWPASSアプリを入れて</text>
    <text x="348" y="216" font-size="12.5" font-weight="600" fill="#6B6A64" class="svg-tx">海外カード(VISA·MC·AMEX)でチャージ</text>
    <text x="348" y="240" font-size="12" font-weight="600" fill="#A8A29A" class="svg-tx">アプリ4% · キオスクは無料</text>
  </g>

  <!-- STEP 3 — 完了 -->
  <g font-family="-apple-system,'Hiragino Sans','Yu Gothic',sans-serif">
    <rect x="612" y="110" width="228" height="180" rx="16" fill="#E3F1EC" stroke="#A9D6C6" stroke-width="1.6" class="svg-card"/>
    <circle cx="650" cy="150" r="18" fill="#0F6E56"/><path d="M642 150l5 5 9-9" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="724" y="156" text-anchor="middle" font-size="17" font-weight="800" fill="#0F6E56">完了</text>
    <text x="634" y="196" font-size="13.5" font-weight="700" fill="#1C5C49">これで1枚で</text>
    <text x="634" y="220" font-size="13" font-weight="600" fill="#2C6B57">· チケット決済</text>
    <text x="634" y="242" font-size="13" font-weight="600" fill="#2C6B57">· 地下鉄・バス・タクシー</text>
    <text x="634" y="264" font-size="13" font-weight="600" fill="#2C6B57">· コンビニ決済</text>
  </g>

  <!-- footer note -->
  <text x="40" y="328" font-family="-apple-system,'Hiragino Sans',sans-serif" font-size="12" font-weight="600" fill="#A8A29A" class="svg-tx">登録・予約時はパスポートの英文氏名を正確に — 1文字違うと入場拒否のリスク。交通だけならT-money コリアツアーカードも代替。</text>
</svg>
