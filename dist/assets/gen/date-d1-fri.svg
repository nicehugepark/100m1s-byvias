<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" width="540" height="540" role="img" aria-label="Show date Friday July 10">
  <title>7/10 Fri show date</title>
  <defs>
    <linearGradient id="d1-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#FBE9D8"/></linearGradient>
    <linearGradient id="d1-band" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F7B36A"/><stop offset="1" stop-color="#E8943A"/></linearGradient>
    <filter id="d1-sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#9A6420" flood-opacity="0.16"/></filter>
  <style>@media (prefers-color-scheme: dark){.svg-panel{fill:#1c1b22!important}.svg-card{fill:#262430!important}.svg-tx{fill:#d6d3cb!important}.svg-bigdate{fill:#4a4668!important}.svg-timecard{fill:#262430!important}}</style></defs>
  <rect x="0" y="0" width="540" height="540" rx="32" fill="url(#d1-bg)" class="svg-panel"/>
  <!-- card -->
  <rect x="46" y="60" width="448" height="420" rx="24" fill="#fff" filter="url(#d1-sh)" class="svg-card"/>
  <!-- top color band = weekday color (Fri = amber) -->
  <path d="M46 84 a24 24 0 0 1 24 -24 h400 a24 24 0 0 1 24 24 v40 h-448 Z" fill="url(#d1-band)"/>
  <text x="270" y="111" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="800" fill="#fff" letter-spacing="2">FRIDAY · 금요일</text>
  <!-- big date -->
  <text x="270" y="220" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="92" font-weight="800" fill="#2E2A4A" letter-spacing="-2" class="svg-bigdate">7.10</text>
  <text x="270" y="252" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="600" fill="#8B8499" class="svg-tx">2026 · KSPO DOME, SEOUL</text>
  <!-- time row -->
  <g transform="translate(0,300)">
    <rect x="86" y="0" width="170" height="84" rx="16" fill="#FFF6EC" stroke="#F3D9BC" stroke-width="1.5" class="svg-timecard"/>
    <text x="171" y="34" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#B07020">START</text>
    <text x="171" y="66" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="30" font-weight="800" fill="#E8943A">19:00</text>
    <rect x="284" y="0" width="170" height="84" rx="16" fill="#FAF8F2" stroke="#E7E5DD" stroke-width="1.5" class="svg-timecard"/>
    <text x="369" y="34" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#8B8499" class="svg-tx">END ≈</text>
    <text x="369" y="66" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="30" font-weight="800" fill="#6B6A64" class="svg-tx">21:40</text>
  </g>
  <!-- D-day pill -->
  <g transform="translate(270,432)">
    <rect x="-92" y="-22" width="184" height="44" rx="22" fill="#E8943A"/>
    <text x="0" y="7" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="19" font-weight="800" fill="#fff">D-day · Night 1</text>
  </g>
  <!-- brand foot -->
  <text x="270" y="516" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#C7396B" letter-spacing="0.5">By<tspan fill="#E84A7F">Vias</tspan></text>
</svg>
