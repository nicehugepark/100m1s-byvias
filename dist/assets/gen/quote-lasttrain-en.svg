<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" width="540" height="540" role="img" aria-label="Quote card: the one last-train trap">
  <title>Quote — the one last-train trap</title>
  <defs>
    <linearGradient id="q-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E84A7F"/><stop offset="1" stop-color="#C7396B"/></linearGradient>
    <radialGradient id="q-glow" cx="50%" cy="22%" r="60%"><stop offset="0" stop-color="#FFD9E7" stop-opacity=".4"/><stop offset="1" stop-color="#FFD9E7" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="0" y="0" width="540" height="540" rx="32" fill="url(#q-bg)"/>
  <rect x="0" y="0" width="540" height="540" rx="32" fill="url(#q-glow)"/>

  <!-- eyebrow chip -->
  <g transform="translate(48,56)">
    <rect x="0" y="0" width="232" height="34" rx="17" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.36)" stroke-width="1.5"/>
    <!-- warning glyph -->
    <circle cx="22" cy="17" r="9" fill="#fff"/><path d="M22 11.5 v5.5 M22 20.5 v0.4" stroke="#C7396B" stroke-width="2.4" stroke-linecap="round"/><circle cx="22" cy="21" r="1.3" fill="#C7396B"/>
    <text x="40" y="22" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="13.5" font-weight="800" fill="#fff" letter-spacing="0.5">The one last-train trap</text>
  </g>

  <!-- big quote mark -->
  <text x="48" y="190" font-family="Georgia,serif" font-size="120" font-weight="700" fill="rgba(255,255,255,0.28)">“</text>

  <!-- quote body -->
  <g font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" fill="#fff">
    <text x="56" y="232" font-size="30" font-weight="800" letter-spacing="-0.5">Line 9 Gimpo Airport-bound</text>
    <text x="56" y="278" font-size="30" font-weight="800" letter-spacing="-0.5">+ Sat/Sun last train</text>
    <text x="56" y="338" font-size="44" font-weight="800" letter-spacing="-1" fill="#FFF4D1">ends at 22:55</text>
  </g>

  <!-- supporting line -->
  <g transform="translate(48,378)">
    <rect x="0" y="0" width="444" height="58" rx="16" fill="rgba(255,255,255,0.16)"/>
    <text x="22" y="25" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#fff">Other lines run 23:55–00:54 — only Line 9 Gaehwa is 1 hr earlier.</text>
    <text x="22" y="46" font-family="-apple-system,sans-serif" font-size="12.5" font-weight="500" fill="rgba(255,255,255,0.85)">Board eastbound, or detour via Line 8 Mongchontoseong.</text>
  </g>

  <!-- brand footer -->
  <g transform="translate(48,486)">
    <text x="0" y="20" font-family="-apple-system,sans-serif" font-size="18" font-weight="800" fill="#fff" letter-spacing="0.3">By<tspan fill="#FFF4D1">Vias</tspan></text>
    <text x="444" y="20" text-anchor="end" font-family="-apple-system,sans-serif" font-size="12.5" font-weight="600" fill="rgba(255,255,255,0.8)">TWICE Seoul trip guide</text>
  </g>
</svg>
